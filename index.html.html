<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>報告分組抽籤神器 - Random Group Generator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas for Screenshot Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', sans-serif;
    }
    .slot-flash {
      animation: flashText 0.08s infinite alternate;
    }
    @keyframes flashText {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1.02); }
    }
    .card-reveal {
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(20px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #64748b;
    }
  </style>
</head>
<body class="min-h-full flex flex-col bg-slate-900 text-slate-100">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid font-black fa-dice text-xl"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400">
            報告分組抽籤神器
          </h1>
          <p class="text-xs text-slate-400">快速、公正、支援複雜條件限制的隨機分組系統</p>
        </div>
      </div>
      <a href="https://github.com" target="_blank" rel="noopener" class="text-slate-400 hover:text-white transition-colors text-sm flex items-center gap-1">
        <i class="fa-brands fa-github text-lg"></i>
        <span class="hidden sm:inline">GitHub Pages Ready</span>
      </a>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Column: Controls & Input Settings -->
    <section class="lg:col-span-5 space-y-6">
      
      <!-- Panel Card: Input Setup -->
      <div class="bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5 shadow-xl backdrop-blur-sm space-y-5">
        <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
          <h2 class="text-base font-bold text-indigo-300 flex items-center gap-2">
            <i class="fa-solid fa-users text-indigo-400"></i> 成員名單輸入
          </h2>
          <span id="memberCountBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-950 text-indigo-300 border border-indigo-800">
            0 人
          </span>
        </div>

        <div>
          <label for="nameList" class="block text-xs font-medium text-slate-300 mb-2">
            請輸入成員姓名（一行一個名字）：
          </label>
          <textarea id="nameList" rows="6" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition text-slate-100 placeholder-slate-500 font-mono" placeholder="陳小明&#10;林大衛&#10;張美麗&#10;黃阿宏..."></textarea>
          <div class="mt-2 flex justify-between items-center text-xs">
            <button id="btnLoadExample" type="button" class="text-indigo-400 hover:text-indigo-300 underline transition">
              載入預設範例名單
            </button>
            <button id="btnClearNames" type="button" class="text-slate-400 hover:text-slate-300 transition">
              清空
            </button>
          </div>
        </div>

        <!-- Group Logic Options -->
        <div class="space-y-4 pt-2 border-t border-slate-700/60">
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">分組邏輯與規則</h3>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Group Target Size -->
            <div>
              <label for="groupSize" class="block text-xs text-slate-400 mb-1">每組目標人數</label>
              <input type="number" id="groupSize" min="1" max="50" value="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            
            <!-- Repeat Assignment Limit -->
            <div>
              <label for="drawLimit" class="block text-xs text-slate-400 mb-1">每人可被分配次數</label>
              <input type="number" id="drawLimit" min="1" max="10" value="1" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
          </div>

          <!-- Remaining People Rule -->
          <div>
            <label class="block text-xs text-slate-400 mb-1">剩餘人數處理方式</label>
            <select id="remainderRule" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none text-slate-200">
              <option value="merge">併入最後一組（例如：剩1-2人直接加到最後組）</option>
              <option value="extra">獨立自成一組（最後一組人數較少）</option>
            </select>
          </div>
        </div>

        <!-- Advanced Constraints (Accordion) -->
        <div class="pt-2 border-t border-slate-700/60">
          <button id="toggleConstraintsBtn" type="button" class="w-full flex justify-between items-center text-xs font-medium text-slate-300 hover:text-white py-1">
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-diagram-project text-purple-400"></i>
              特殊限制條件（綁定與避開）
            </span>
            <i id="accordionIcon" class="fa-solid fa-chevron-down text-slate-400 transition-transform"></i>
          </button>

          <div id="constraintsSection" class="hidden space-y-3 mt-3 pt-2">
            <!-- Must Bind -->
            <div>
              <label for="mustBind" class="block text-xs text-slate-400 mb-1">
                <i class="fa-solid fa-link text-emerald-400 mr-1"></i> 必須同組（用逗號分隔，一行一組對象）：
              </label>
              <textarea id="mustBind" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs font-mono outline-none focus:ring-2 focus:ring-emerald-500" placeholder="例如：張三, 李四&#10;王五, 趙六"></textarea>
            </div>

            <!-- Must Avoid -->
            <div>
              <label for="mustAvoid" class="block text-xs text-slate-400 mb-1">
                <i class="fa-solid fa-user-slash text-rose-400 mr-1"></i> 不能同組（用逗號分隔，一行一對對象）：
              </label>
              <textarea id="mustAvoid" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-xs font-mono outline-none focus:ring-2 focus:ring-rose-500" placeholder="例如：陳大明, 林阿花"></textarea>
            </div>
            <p class="text-[11px] text-slate-400">※ 系統將自動在抽籤時計算滿足條件的組合。</p>
          </div>
        </div>

        <!-- Action Button: Prepare Groups -->
        <button id="btnGeneratePlan" type="button" class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 font-bold rounded-xl shadow-lg shadow-indigo-600/30 transition transform active:scale-98 flex items-center justify-center gap-2 text-white">
          <i class="fa-solid fa-wand-magic-sparkles"></i> 生成抽籤規劃與組合
        </button>
      </div>

    </section>

    <!-- Right Column: Reveal & Results Area -->
    <section class="lg:col-span-7 space-y-6 flex flex-col">

      <!-- Slot Machine / Announcement Marquee Screen -->
      <div class="bg-gradient-to-b from-slate-800 to-slate-900 border border-slate-700/80 rounded-2xl p-6 shadow-2xl text-center relative overflow-hidden">
        <!-- Decorative Glow -->
        <div class="absolute -top-12 -left-12 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-12 -right-12 w-40 h-40 bg-pink-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <div class="text-xs uppercase tracking-widest text-indigo-400 font-semibold mb-2">
          抽籤大舞台 Marquee Reveal Stage
        </div>

        <!-- Animated Display Box -->
        <div id="marqueeContainer" class="h-28 bg-slate-950/80 border border-slate-800 rounded-xl flex flex-col items-center justify-center p-4 my-2 relative overflow-hidden">
          <div id="marqueeSubtext" class="text-xs text-slate-400 mb-1">等待啟動抽籤...</div>
          <div id="marqueeText" class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-pink-400 to-indigo-300 tracking-wide">
            準備就緒
          </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="flex flex-wrap items-center justify-center gap-3 mt-4">
          <button id="btnRevealNext" disabled type="button" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 disabled:cursor-not-allowed font-semibold rounded-xl transition flex items-center gap-2 shadow-lg shadow-indigo-600/20 text-sm">
            <i class="fa-solid fa-play"></i> 揭曉下一組
          </button>
          
          <button id="btnRevealAll" disabled type="button" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 disabled:bg-slate-800 disabled:text-slate-600 disabled:cursor-not-allowed font-semibold rounded-xl transition flex items-center gap-2 shadow-lg shadow-purple-600/20 text-sm">
            <i class="fa-solid fa-bolt"></i> 一鍵全數揭曉
          </button>

          <button id="btnReset" type="button" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl transition flex items-center gap-1.5 text-sm">
            <i class="fa-solid fa-rotate-left"></i> 重置
          </button>
        </div>
      </div>

      <!-- Results Display Grid -->
      <div class="flex-1 bg-slate-800/80 border border-slate-700/60 rounded-2xl p-5 shadow-xl flex flex-col">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-700/60 pb-3 mb-4">
          <div class="flex items-center gap-2">
            <h2 class="text-base font-bold text-indigo-300 flex items-center gap-2">
              <i class="fa-solid fa-square-poll-vertical"></i> 分組結果
            </h2>
            <span id="revealedStatusBadge" class="text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300">
              未開始
            </span>
          </div>

          <!-- Utility Export Buttons -->
          <div class="flex items-center gap-2">
            <button id="btnCopyText" type="button" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-lg transition flex items-center gap-1">
              <i class="fa-solid fa-copy"></i> 複製文字
            </button>
            <button id="btnDownloadImage" type="button" class="px-3 py-1.5 bg-emerald-700 hover:bg-emerald-600 text-emerald-100 text-xs rounded-lg transition flex items-center gap-1">
              <i class="fa-solid fa-image"></i> 下載截圖
            </button>
          </div>
        </div>

        <!-- Group Cards Area -->
        <div id="resultsExportContainer" class="p-2 rounded-xl bg-slate-900/40 min-h-[280px]">
          <div id="groupsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <!-- Empty Placeholder -->
            <div id="emptyGridNotice" class="col-span-full flex flex-col items-center justify-center py-16 text-slate-500">
              <i class="fa-solid fa-layer-group text-4xl mb-3 opacity-40"></i>
              <p class="text-sm">點擊左側「生成抽籤規劃」即可開啟分組序幕</p>
            </div>
          </div>
        </div>

      </div>

    </section>

  </main>

  <!-- Global Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-out bg-slate-800 border border-slate-600 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
    <i id="toastIcon" class="fa-solid fa-circle-info text-indigo-400"></i>
    <span id="toastMsg" class="text-sm">通知訊息</span>
  </div>

  <script>
    // --- Application State ---
    let nameList = [];
    let plannedGroups = []; // Array of arrays: [ ['A','B'], ['C','D'] ]
    let currentRevealIndex = 0;
    let isAnimating = false;

    // Default Example Names
    const exampleNames = [
      "陳小明", "林大衛", "張美麗", "黃阿宏", "許小芬",
      "蔡志強", "鄭雅婷", "郭建國", "謝佩珊", "曾俊傑",
      "廖淑芬", "賴冠宇", "徐佳玲", "周傑倫", "葉哲瑋"
    ];

    // DOM Elements
    const nameListEl = document.getElementById('nameList');
    const memberCountBadge = document.getElementById('memberCountBadge');
    const groupSizeEl = document.getElementById('groupSize');
    const drawLimitEl = document.getElementById('drawLimit');
    const remainderRuleEl = document.getElementById('remainderRule');
    const mustBindEl = document.getElementById('mustBind');
    const mustAvoidEl = document.getElementById('mustAvoid');

    const btnLoadExample = document.getElementById('btnLoadExample');
    const btnClearNames = document.getElementById('btnClearNames');
    const btnGeneratePlan = document.getElementById('btnGeneratePlan');
    const btnRevealNext = document.getElementById('btnRevealNext');
    const btnRevealAll = document.getElementById('btnRevealAll');
    const btnReset = document.getElementById('btnReset');
    const btnCopyText = document.getElementById('btnCopyText');
    const btnDownloadImage = document.getElementById('btnDownloadImage');

    const marqueeText = document.getElementById('marqueeText');
    const marqueeSubtext = document.getElementById('marqueeSubtext');
    const groupsGrid = document.getElementById('groupsGrid');
    const emptyGridNotice = document.getElementById('emptyGridNotice');
    const revealedStatusBadge = document.getElementById('revealedStatusBadge');

    const toggleConstraintsBtn = document.getElementById('toggleConstraintsBtn');
    const constraintsSection = document.getElementById('constraintsSection');
    const accordionIcon = document.getElementById('accordionIcon');

    // Toast UI Handler
    function showToast(message, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.textContent = message;
      if (type === 'success') {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
      } else if (type === 'error') {
        toastIcon.className = 'fa-solid fa-triangle-exclamation text-rose-400';
      } else {
        toastIcon.className = 'fa-solid fa-circle-info text-indigo-400';
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    // Toggle Accordion
    toggleConstraintsBtn.addEventListener('click', () => {
      constraintsSection.classList.toggle('hidden');
      accordionIcon.classList.toggle('rotate-180');
    });

    // Helper: Parse Input Name List
    function parseNames() {
      const raw = nameListEl.value;
      return raw.split('\n')
                .map(n => n.trim())
                .filter(n => n.length > 0);
    }

    function updateMemberCount() {
      const names = parseNames();
      memberCountBadge.textContent = `${names.length} 人`;
    }

    nameListEl.addEventListener('input', updateMemberCount);

    btnLoadExample.addEventListener('click', () => {
      nameListEl.value = exampleNames.join('\n');
      updateMemberCount();
      showToast('已載入預設範例名單！', 'success');
    });

    btnClearNames.addEventListener('click', () => {
      nameListEl.value = '';
      updateMemberCount();
    });

    // --- Core Grouping Algorithm with Constraints ---
    function generateGroupAllocation() {
      const baseNames = parseNames();
      if (baseNames.length === 0) {
        showToast('請先輸入成員姓名！', 'error');
        return null;
      }

      const targetGroupSize = parseInt(groupSizeEl.value, 10) || 3;
      const repeatLimit = parseInt(drawLimitEl.value, 10) || 1;
      const remainderRule = remainderRuleEl.value;

      // Expand names pool according to repeatLimit
      let pool = [];
      for (let i = 0; i < repeatLimit; i++) {
        pool.push(...baseNames);
      }

      // Parse Must-Bind pairs/groups
      const rawMustBind = mustBindEl.value.split('\n').filter(line => line.trim().length > 0);
      const mustBindGroups = rawMustBind.map(line => 
        line.split(/[,，]/).map(item => item.trim()).filter(item => item.length > 0)
      ).filter(group => group.length > 1);

      // Parse Must-Avoid pairs
      const rawMustAvoid = mustAvoidEl.value.split('\n').filter(line => line.trim().length > 0);
      const mustAvoidPairs = rawMustAvoid.map(line => 
        line.split(/[,，]/).map(item => item.trim()).filter(item => item.length > 0)
      ).filter(pair => pair.length >= 2);

      // Calculate total required groups
      const totalElements = pool.length;
      let numGroups = Math.floor(totalElements / targetGroupSize);
      if (remainderRule === 'extra' && totalElements % targetGroupSize !== 0) {
        numGroups += 1;
      }
      if (numGroups === 0) numGroups = 1;

      // Backtracking / Monte Carlo trial to find valid grouping
      let bestResult = null;
      const maxAttempts = 200;

      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        // Shuffle pool
        let currentPool = [...pool];
        shuffleArray(currentPool);

        let groups = Array.from({ length: numGroups }, () => []);

        // Step 1: Enforce Must-Bind Constraints
        let bindSuccess = true;
        for (const bindGroup of mustBindGroups) {
          // Find a group with enough space
          const groupIdx = groups.findIndex(g => (targetGroupSize - g.length) >= bindGroup.length);
          if (groupIdx !== -1) {
            bindGroup.forEach(member => {
              groups[groupIdx].push(member);
              // Remove one instance of member from currentPool
              const pIdx = currentPool.indexOf(member);
              if (pIdx !== -1) currentPool.splice(pIdx, 1);
            });
          } else {
            bindSuccess = false;
            break;
          }
        }
        if (!bindSuccess) continue;

        // Step 2: Fill remaining members
        let fillSuccess = true;
        for (const member of currentPool) {
          // Find groups that can accept this member without violating constraints
          let validGroupIndices = [];
          for (let i = 0; i < groups.length; i++) {
            const group = groups[i];
            
            // Check max size constraint (except last group in merge mode)
            if (remainderRule === 'merge' && i === groups.length - 1) {
              // last group can accept more
            } else if (group.length >= targetGroupSize) {
              continue;
            }

            // Check if adding this member creates duplicate in same group (unless repeat Limit explicitly allows, but usually same person shouldn't be in same group)
            if (group.includes(member)) continue;

            // Check Must-Avoid Constraint
            let hasConflict = false;
            for (const pair of mustAvoidPairs) {
              if (pair.includes(member)) {
                const otherInPair = pair.find(m => m !== member);
                if (group.includes(otherInPair)) {
                  hasConflict = true;
                  break;
                }
              }
            }

            if (!hasConflict) {
              validGroupIndices.push(i);
            }
          }

          if (validGroupIndices.length === 0) {
            fillSuccess = false;
            break;
          }

          // Pick random eligible group
          const targetGIdx = validGroupIndices[Math.floor(Math.random() * validGroupIndices.length)];
          groups[targetGIdx].push(member);
        }

        if (fillSuccess) {
          bestResult = groups;
          break;
        }
      }

      // Fallback: If constraints are too strict to satisfy 100%, perform standard randomized shuffle
      if (!bestResult) {
        showToast('限制條件較為嚴格，已儘量優化並產生隨機組合。', 'info');
        let fallbackPool = [...pool];
        shuffleArray(fallbackPool);
        bestResult = Array.from({ length: numGroups }, () => []);
        fallbackPool.forEach((member, index) => {
          const gIdx = Math.min(Math.floor(index / targetGroupSize), numGroups - 1);
          bestResult[gIdx].push(member);
        });
      }

      return bestResult;
    }

    // Helper: Fisher-Yates Shuffle
    function shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    }

    // --- Action: Prepare Plan ---
    btnGeneratePlan.addEventListener('click', () => {
      const plan = generateGroupAllocation();
      if (!plan) return;

      plannedGroups = plan;
      currentRevealIndex = 0;

      // Reset UI Stage
      groupsGrid.innerHTML = '';
      revealedStatusBadge.textContent = `0 / ${plannedGroups.length} 組已揭曉`;
      revealedStatusBadge.className = 'text-xs px-2 py-0.5 rounded bg-indigo-950 text-indigo-300 border border-indigo-800';

      marqueeSubtext.textContent = `共 ${plannedGroups.length} 組準備完畢，請點擊「揭曉下一組」`;
      marqueeText.textContent = '準備揭曉第 1 組';

      btnRevealNext.disabled = false;
      btnRevealAll.disabled = false;

      showToast(`分組規劃已生成，共分成 ${plannedGroups.length} 組！`, 'success');
    });

    // --- Marquee Slot Reveal Logic ---
    function revealGroup(groupIndex, onComplete) {
      if (isAnimating) return;
      isAnimating = true;

      const groupMembers = plannedGroups[groupIndex];
      const allNames = parseNames();

      marqueeSubtext.textContent = `正在抽籤開牌：【第 ${groupIndex + 1} 組】...`;
      marqueeText.classList.add('slot-flash');

      let counter = 0;
      const duration = 1200; // 1.2s animation
      const intervalTime = 60;

      const timer = setInterval(() => {
        // Randomly pick temporary names for marquee visual
        const randomName = allNames[Math.floor(Math.random() * allNames.length)];
        marqueeText.textContent = `🎲 ${randomName} ?`;
        counter += intervalTime;

        if (counter >= duration) {
          clearInterval(timer);
          marqueeText.classList.remove('slot-flash');
          marqueeText.textContent = `【第 ${groupIndex + 1} 組】 ${groupMembers.join('、')}`;
          
          // Add Card to Grid
          renderGroupCard(groupIndex + 1, groupMembers);

          currentRevealIndex++;
          revealedStatusBadge.textContent = `${currentRevealIndex} / ${plannedGroups.length} 組已揭曉`;

          if (currentRevealIndex >= plannedGroups.length) {
            btnRevealNext.disabled = true;
            btnRevealAll.disabled = true;
            marqueeSubtext.textContent = '🎉 全部分組已揭曉完畢！';
            revealedStatusBadge.className = 'text-xs px-2 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800';
          } else {
            marqueeSubtext.textContent = `點擊「揭曉下一組」揭曉第 ${currentRevealIndex + 1} 組`;
          }

          isAnimating = false;
          if (onComplete) onComplete();
        }
      }, intervalTime);
    }

    function renderGroupCard(groupNum, members) {
      // Remove notice if exists
      if (emptyGridNotice) emptyGridNotice.style.display = 'none';

      const card = document.createElement('div');
      card.className = 'card-reveal bg-slate-800 border border-slate-700/80 rounded-xl p-4 shadow-md hover:border-indigo-500/50 transition';

      const memberBadges = members.map(m => `
        <span class="inline-block px-2.5 py-1 bg-slate-900 border border-slate-700 text-slate-200 text-xs font-medium rounded-lg">
          <i class="fa-solid fa-user text-indigo-400 mr-1 text-[10px]"></i>${m}
        </span>
      `).join('');

      card.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-700/60 pb-2 mb-3">
          <span class="text-sm font-bold text-indigo-300">第 ${groupNum} 組</span>
          <span class="text-[11px] text-slate-400"><i class="fa-solid fa-users text-[10px] mr-1"></i>${members.length} 人</span>
        </div>
        <div class="flex flex-wrap gap-2">
          ${memberBadges}
        </div>
      `;

      groupsGrid.appendChild(card);
    }

    // Reveal Next Button Click
    btnRevealNext.addEventListener('click', () => {
      if (currentRevealIndex < plannedGroups.length) {
        revealGroup(currentRevealIndex);
      }
    });

    // Reveal All Instant
    btnRevealAll.addEventListener('click', () => {
      if (isAnimating) return;

      const runRemaining = () => {
        if (currentRevealIndex < plannedGroups.length) {
          revealGroup(currentRevealIndex, runRemaining);
        }
      };
      runRemaining();
    });

    // Reset All
    btnReset.addEventListener('click', () => {
      plannedGroups = [];
      currentRevealIndex = 0;
      isAnimating = false;

      groupsGrid.innerHTML = `
        <div id="emptyGridNotice" class="col-span-full flex flex-col items-center justify-center py-16 text-slate-500">
          <i class="fa-solid fa-layer-group text-4xl mb-3 opacity-40"></i>
          <p class="text-sm">點擊左側「生成抽籤規劃」即可開啟分組序幕</p>
        </div>
      `;

      btnRevealNext.disabled = true;
      btnRevealAll.disabled = true;

      marqueeSubtext.textContent = '等待啟動抽籤...';
      marqueeText.textContent = '準備就緒';
      revealedStatusBadge.textContent = '未開始';
      revealedStatusBadge.className = 'text-xs px-2 py-0.5 rounded bg-slate-700 text-slate-300';

      showToast('已重置所有抽籤狀態！');
    });

    // --- Copy Results as Formatted Text ---
    btnCopyText.addEventListener('click', () => {
      if (plannedGroups.length === 0 || currentRevealIndex === 0) {
        showToast('目前尚無可複製的分組結果！', 'error');
        return;
      }

      let formattedText = `📊 【報告分組抽籤結果】\n`;
      formattedText += `📅 產生時間：${new Date().toLocaleString('zh-TW')}\n`;
      formattedText += `------------------------------\n`;

      for (let i = 0; i < currentRevealIndex; i++) {
        formattedText += `【第 ${i + 1} 組】${plannedGroups[i].join('、')}\n`;
      }

      // Use execCommand for iframe compatibility
      const dummyArea = document.createElement('textarea');
      dummyArea.value = formattedText;
      document.body.appendChild(dummyArea);
      dummyArea.select();
      document.execCommand('copy');
      document.body.removeChild(dummyArea);

      showToast('分組結果已成功複製至剪貼簿！', 'success');
    });

    // --- Download Screenshot Image ---
    btnDownloadImage.addEventListener('click', () => {
      if (plannedGroups.length === 0 || currentRevealIndex === 0) {
        showToast('目前尚無可導出的分組結果！', 'error');
        return;
      }

      showToast('正在生成圖片中，請稍候...', 'info');

      const target = document.getElementById('resultsExportContainer');
      html2canvas(target, {
        backgroundColor: '#0f172a',
        scale: 2
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `分組結果_${new Date().toISOString().slice(0, 10)}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('圖片下載成功！', 'success');
      }).catch(err => {
        console.error(err);
        showToast('圖片下載失敗，請重新嘗試。', 'error');
      });
    });

    // Initial Badge Count Load
    updateMemberCount();
  </script>
</body>
</html>
