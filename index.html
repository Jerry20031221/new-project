<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>幸運分組｜互動式隨機分組工具</title>
<style>
:root{--bg:#0b1020;--panel:#151d33;--panel2:#1c2944;--text:#f4f7ff;--muted:#a9b9d5;--accent:#7c9cff;--pink:#fa8dbd;--line:#344361;--good:#69e5bc}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0%,#233763 0%,transparent 40%),radial-gradient(circle at 90% 30%,#362449 0%,transparent 35%),var(--bg);min-height:100vh}main{max-width:1180px;margin:auto;padding:34px 18px 70px}header{text-align:center;margin-bottom:30px}h1{font-size:clamp(2rem,5vw,3.3rem);margin:0 0 8px}header p,.hint{color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(290px,390px) 1fr;gap:20px}.panel{background:rgba(21,29,51,.95);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 15px 40px #0002}h2{font-size:1.25rem;margin:0 0 18px}label{display:block;font-weight:650;font-size:.93rem;margin:14px 0 7px}textarea,input,select{width:100%;background:#0e172a;border:1px solid #435170;color:white;border-radius:11px;padding:11px 12px;font:inherit;outline:none}textarea:focus,input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px #7c9cff22}textarea{resize:vertical;min-height:135px}.smallarea{min-height:64px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hint{font-size:.8rem;margin:6px 0 0;line-height:1.5}.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer;background:var(--panel2);color:var(--text);transition:transform .15s,filter .15s}button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.15)}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:linear-gradient(110deg,#6886ff,#a86ff5);color:white}.pink{background:linear-gradient(110deg,#d95c9a,#ab6cf2)}.wide{width:100%}.status{min-height:24px;color:var(--muted);font-size:.92rem;margin:12px 0}.status.error{color:#ff9eae}.stage{background:linear-gradient(145deg,#192845,#17203a);border:1px solid #3e4c6e;border-radius:18px;padding:24px;text-align:center;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.stage .eyebrow{color:#b8c8ef;font-size:.9rem;letter-spacing:.15em}.stage .name{font-size:clamp(1.6rem,4vw,2.7rem);font-weight:900;margin:18px 0;min-height:60px;display:grid;place-items:center}.stage .name.spinning{animation:flip .17s infinite alternate}@keyframes flip{from{transform:perspective(500px) rotateX(-18deg) scale(.95);opacity:.6}to{transform:perspective(500px) rotateX(18deg) scale(1.04);opacity:1}}.stage .sub{color:var(--muted)}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:20px}.group{background:#1b2843;border:1px solid #42577e;border-radius:16px;padding:18px;animation:rise .45s ease both}.group h3{margin:0 0 12px;color:#a9bbff}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#2c3d61;border:1px solid #4c6390;border-radius:99px;padding:7px 11px;font-size:.94rem}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}.empty{color:var(--muted);padding:26px;text-align:center;border:1px dashed #435170;border-radius:14px;margin-top:20px}.footnote{font-size:.82rem;color:var(--muted);line-height:1.7;margin-top:15px}#capture{padding:2px}#captureTitle{display:none}body.capturing #capture{background:#101a30;padding:24px;border-radius:18px}body.capturing #captureTitle{display:block;margin:0 0 16px}body.capturing .empty{display:none}@media(max-width:820px){.layout{grid-template-columns:1fr}.panel{padding:19px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition:none!important}}
</style>
</head>
<body><main><header><h1>🎲 幸運分組</h1><p>輸入名單、設定限制，讓每一組的揭曉都充滿驚喜。</p></header><div class="layout"><section class="panel"><h2>⚙️ 名單與參數</h2><label for="names">成員名單（一行一位）</label><textarea id="names" spellcheck="false">張三
李四
王五
趙六
陳小明
林小美
黃大華
吳佳玲
許文哲
周怡君
鄭宇軒
蔡佩珊</textarea><p class="hint">姓名不可重複，空白行會自動忽略。</p><div class="row"><div><label for="size">每組目標人數</label><input id="size" type="number" min="1" max="999" value="4"></div><div><label for="repeats">每人分配次數</label><input id="repeats" type="number" min="1" max="20" value="1"></div></div><label for="remainder">剩餘人員處理</label><select id="remainder"><option value="last">併入最後一組</option><option value="separate">獨立成組</option></select><label for="together">必須同組（每行一組）</label><textarea class="smallarea" id="together" placeholder="張三, 李四"></textarea><p class="hint">同一行可輸入兩人以上，使用半形或全形逗號分隔。</p><label for="apart">不能同組（每行一組）</label><textarea class="smallarea" id="apart" placeholder="王五, 趙六"></textarea><p class="hint">同一行所有成員兩兩不能同組。</p><div class="btnrow"><button id="generate" class="primary wide">✨ 產生隨機分組</button><button id="reset" class="wide">↺ 重設揭曉</button></div><div id="message" class="status" role="status" aria-live="polite"></div><p class="footnote">每人重複分配時，會盡量避免同一人在同一組重複出現。「必須同組」以每輪共同出現來處理；若條件互相衝突，系統會提示調整。</p></section><section class="panel"><h2>🎉 分組揭曉</h2><div class="stage" aria-live="off"><div class="eyebrow" id="stageLabel">準備開始</div><div class="name" id="stageName">✨ 等待抽籤 ✨</div><div class="sub" id="stageSub">先點擊左側「產生隨機分組」</div></div><div class="btnrow"><button id="next" class="pink" disabled>🎴 揭曉下一組</button><button id="all" disabled>⚡ 一鍵揭曉全部</button><button id="copy" disabled>📋 複製文字</button><button id="download" disabled>📸 下載 PNG</button></div><div id="capture"><h2 id="captureTitle">🎲 幸運分組結果</h2><div id="results" class="results"></div><div id="empty" class="empty">分組結果將顯示在這裡</div></div><p class="footnote">PNG 截圖功能透過 html2canvas CDN 載入，需保持網路連線；其他分組功能可離線使用。</p></section></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let groups=[],shown=0,busy=false,token=0;const buttons=['next','all','copy','download'];function msg(s,error=false){$('message').textContent=s;$('message').className='status'+(error?' error':'')}function sync(){const ready=groups.length>0; $('next').disabled=!ready||busy||shown>=groups.length;$('all').disabled=!ready||busy||shown>=groups.length;$('copy').disabled=!ready||busy||shown===0;$('download').disabled=!ready||busy||shown===0;$('generate').disabled=busy;$('reset').disabled=busy}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function parseRules(id,valid){return $(id).value.split(/\r?\n/).map(s=>s.split(/[,，、]/).map(x=>x.trim()).filter(Boolean)).filter(a=>a.length).map(a=>{if(a.length<2)throw Error('關係限制每行至少需要兩個姓名。');for(const n of a)if(!valid.has(n))throw Error('限制名單中的「'+n+'」不在成員名單內。');return [...new Set(a)]}).filter(a=>a.length>1)}function solve(names,size,repeats,mode,together,apart){const parent=new Map(names.map(n=>[n,n]));function root(x){while(parent.get(x)!==x)x=parent.get(x);return x}function union(a,b){parent.set(root(a),root(b))}for(const rule of together)for(let i=1;i<rule.length;i++)union(rule[0],rule[i]);const blocks=[...new Set(names.map(root))].map(r=>names.filter(n=>root(n)===r));const enemies=new Map(names.map(n=>[n,new Set()]));for(const rule of apart)for(let i=0;i<rule.length;i++)for(let j=i+1;j<rule.length;j++){enemies.get(rule[i]).add(rule[j]);enemies.get(rule[j]).add(rule[i]);if(root(rule[i])===root(rule[j]))throw Error('「必須同組」與「不能同組」互相衝突：'+rule[i]+'、'+rule[j])}const total=names.length*repeats;let capacities=[];const full=Math.floor(total/size),rem=total%size;for(let i=0;i<full;i++)capacities.push(size);if(rem){if(mode==='separate'||!capacities.length)capacities.push(rem);else capacities[capacities.length-1]+=rem}if(blocks.some(b=>b.length>Math.max(...capacities)))throw Error('必須同組的人數超過組別容量，請調整每組人數。');const tasks=[];for(let r=0;r<repeats;r++)for(const b of blocks)tasks.push([...b]);let best=null;for(let attempt=0;attempt<160;attempt++){const slots=capacities.map(()=>[]);const ordered=shuffle(tasks).sort((a,b)=>b.length-a.length);let steps=0;function place(k){if(k===ordered.length)return true;if(++steps>18000)return false;const block=ordered[k];const choices=shuffle(slots.map((g,i)=>i)).sort((a,b)=>slots[b].length-slots[a].length);for(const i of choices){const g=slots[i];if(g.length+block.length>capacities[i])continue;if(block.some(n=>g.includes(n)||g.some(x=>enemies.get(n).has(x))))continue;g.push(...block);if(place(k+1))return true;g.splice(g.length-block.length,block.length)}return false}if(place(0)){best=shuffle(slots.map(g=>shuffle(g)));break}}if(!best)throw Error('無法在目前人數、重複次數與關係限制下完成分組。請調整條件後重試。');return best}function render(){const box=$('results');box.replaceChildren();groups.slice(0,shown).forEach((g,i)=>{const card=document.createElement('article');card.className='group';const h=document.createElement('h3');h.textContent='第 '+(i+1)+' 組';const chips=document.createElement('div');chips.className='chips';g.forEach(n=>{const chip=document.createElement('span');chip.className='chip';chip.textContent=n;chips.append(chip)});card.append(h,chips);box.append(card)});$('empty').hidden=shown>0;$('empty').style.display=shown>0?'none':'';sync()}function stage(label,name,sub){$('stageLabel').textContent=label;$('stageName').textContent=name;$('stageSub').textContent=sub}function generate(){try{const names=$('names').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),size=Number($('size').value),repeats=Number($('repeats').value);if(!names.length)throw Error('請先輸入至少一位成員。');if(new Set(names).size!==names.length)throw Error('名單有重複姓名，請先移除重複項目。');if(!Number.isSafeInteger(size)||size<1||size>999)throw Error('每組人數請輸入 1 至 999 的整數。');if(!Number.isSafeInteger(repeats)||repeats<1||repeats>20)throw Error('分配次數請輸入 1 至 20 的整數。');if(names.length*repeats>1000)throw Error('總分配名額上限為 1000，請縮減名單或次數。');const valid=new Set(names),together=parseRules('together',valid),apart=parseRules('apart',valid);groups=solve(names,size,repeats,$('remainder').value,together,apart);shown=0;token++;stage('準備就緒','🎁 '+groups.length+' 組待揭曉','點擊「揭曉下一組」開始');msg('成功產生 '+groups.length+' 組，共 '+names.length*repeats+' 個分配名額。');render()}catch(e){msg(e.message,true)}}async function next(){if(busy||shown>=groups.length)return;busy=true;sync();const current=++token;const pool=groups.flat();stage('第 '+(shown+1)+' 組｜抽籤中','🎲','即將揭曉…');$('stageName').classList.add('spinning');const start=Date.now();await new Promise(resolve=>{const timer=setInterval(()=>{if(current!==token||Date.now()-start>=1400){clearInterval(timer);resolve();return}$('stageName').textContent=pool[Math.floor(Math.random()*pool.length)]},75)});$('stageName').classList.remove('spinning');shown++;stage('第 '+shown+' 組｜揭曉！',groups[shown-1].join('、'),shown===groups.length?'🎉 全部分組揭曉完成':'下一組即將登場');busy=false;render()}function all(){if(busy||!groups.length)return;shown=groups.length;stage('全部揭曉','🎊 分組完成！','下方查看完整結果');render()}function formatted(){return groups.slice(0,shown).map((g,i)=>'【第 '+(i+1)+' 組】'+g.join('、')).join('\n')}async function copy(){const value=formatted();try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('複製失敗');t.remove()}msg('已複製 '+shown+' 組結果。')}catch(e){msg('複製失敗，請改用 HTTPS 開啟頁面。',true)}}async function download(){if(typeof html2canvas!=='function'){msg('截圖套件尚未載入，請確認網路連線後重新整理。',true);return}document.body.classList.add('capturing');try{const canvas=await html2canvas($('capture'),{backgroundColor:'#101a30',scale:Math.min(2,window.devicePixelRatio||1),useCORS:true});const a=document.createElement('a');a.download='幸運分組結果.png';a.href=canvas.toDataURL('image/png');document.body.append(a);a.click();a.remove();msg('PNG 圖片已下載。')}catch(e){msg('圖片匯出失敗：'+e.message,true)}finally{document.body.classList.remove('capturing')}}$('generate').addEventListener('click',generate);$('next').addEventListener('click',next);$('all').addEventListener('click',all);$('copy').addEventListener('click',copy);$('download').addEventListener('click',download);$('reset').addEventListener('click',()=>{if(!groups.length){msg('請先產生分組。');return}shown=0;token++;stage('準備就緒','🎁 '+groups.length+' 組待揭曉','可重新逐組揭曉相同分組');render();msg('已重設揭曉進度，分組內容不變。')});sync()})();
</script></body></html>
